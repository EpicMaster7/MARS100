name: Import project files

on:
  push:
    branches: [main]
    paths: [MARS100_transfer.zip]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: |
          unzip -q MARS100_transfer.zip -d .import
          cp -a .import/MARS100/. .
          rm -rf .import MARS100_transfer.zip
          rm .github/workflows/import-project.yml
      - name: Commit files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || (git commit -m 'Add MARS/100 model, dashboard, figures, and slides' && git push)
